name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run test suite (incl. end-to-end environment simulation)
        run: coverage run --source=antiraid -m unittest discover -s tests -p "test_*.py"

      - name: Coverage report
        run: |
          coverage report -m
          coverage report -m --omit="antiraid/bot.py" --fail-under=95

      - name: Run standalone environment simulation
        run: python simulate.py
